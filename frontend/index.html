<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure authentication system with JWT login and registration" />
    <title>SecureAuth — Login & Register</title>

    <!-- Google Fonts: Inter for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Link to our styles -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <!-- ============================================ -->
    <!-- Background Animated Orbs (visual decoration) -->
    <!-- ============================================ -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- ============================================ -->
    <!-- Main Auth Container                          -->
    <!-- ============================================ -->
    <main class="auth-container" id="authContainer">

        <!-- Header / Branding -->
        <div class="auth-header">
            <div class="logo" id="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="12" fill="url(#logoGradient)" />
                    <path d="M20 10L28 15V25L20 30L12 25V15L20 10Z" stroke="white" stroke-width="2" fill="none" />
                    <circle cx="20" cy="20" r="4" fill="white" />
                    <defs>
                        <linearGradient id="logoGradient" x1="0" y1="0" x2="40" y2="40">
                            <stop stop-color="#6366f1" />
                            <stop offset="1" stop-color="#8b5cf6" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="auth-title" id="authTitle">Welcome Back</h1>
            <p class="auth-subtitle" id="authSubtitle">Sign in to your account to continue</p>
        </div>

        <!-- ============================================ -->
        <!-- Form Toggle Tabs                             -->
        <!-- ============================================ -->
        <div class="tab-container" id="tabContainer">
            <button class="tab active" id="loginTab" onclick="switchForm('login')">Sign In</button>
            <button class="tab" id="registerTab" onclick="switchForm('register')">Create Account</button>
            <div class="tab-indicator" id="tabIndicator"></div>
        </div>

        <!-- ============================================ -->
        <!-- Login Form                                   -->
        <!-- ============================================ -->
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
            <!-- Email Field -->
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="3" />
                        <polyline points="22,4 12,13 2,4" />
                    </svg>
                    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required />
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7,11V7a5,5,0,0,1,10,0v4" />
                    </svg>
                    <input type="password" id="loginPassword" placeholder="Enter your password"
                        autocomplete="current-password" required />
                    <!-- Toggle password visibility -->
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)"
                        aria-label="Toggle password visibility">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="btn-loader" style="display:none">
                    <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="12" cy="12" r="10" opacity="0.25" />
                        <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round" />
                    </svg>
                    Signing in...
                </span>
            </button>
        </form>

        <!-- ============================================ -->
        <!-- Registration Form                            -->
        <!-- ============================================ -->
        <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
            <!-- Username Field -->
            <div class="form-group">
                <label for="registerUsername">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" id="registerUsername" placeholder="Choose a username" autocomplete="username"
                        required />
                </div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="3" />
                        <polyline points="22,4 12,13 2,4" />
                    </svg>
                    <input type="email" id="registerEmail" placeholder="you@example.com" autocomplete="email"
                        required />
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="registerPassword">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7,11V7a5,5,0,0,1,10,0v4" />
                    </svg>
                    <input type="password" id="registerPassword" placeholder="Min. 6 characters"
                        autocomplete="new-password" minlength="6" required />
                    <button type="button" class="password-toggle" onclick="togglePassword('registerPassword', this)"
                        aria-label="Toggle password visibility">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
                <!-- Password strength indicator -->
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <p class="strength-text" id="strengthText"></p>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="registerConfirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7,11V7a5,5,0,0,1,10,0v4" />
                    </svg>
                    <input type="password" id="registerConfirmPassword" placeholder="Repeat your password"
                        autocomplete="new-password" required />
                    <button type="button" class="password-toggle"
                        onclick="togglePassword('registerConfirmPassword', this)"
                        aria-label="Toggle password visibility">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" id="registerBtn">
                <span class="btn-text">Create Account</span>
                <span class="btn-loader" style="display:none">
                    <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="12" cy="12" r="10" opacity="0.25" />
                        <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round" />
                    </svg>
                    Creating account...
                </span>
            </button>
        </form>

        <!-- ============================================ -->
        <!-- Message Display Area                         -->
        <!-- ============================================ -->
        <div class="message-container" id="messageContainer"></div>

        <!-- ============================================ -->
        <!-- Token Display (shown after successful login) -->
        <!-- ============================================ -->
        <div class="token-display" id="tokenDisplay" style="display:none">
            <div class="token-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                <h3>Authentication Successful</h3>
            </div>
            <p class="token-label">Your JWT Token:</p>
            <div class="token-value-wrapper">
                <code class="token-value" id="tokenValue"></code>
                <button type="button" class="copy-btn" id="copyBtn" onclick="copyToken()"
                    aria-label="Copy token to clipboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <rect x="9" y="9" width="13" height="13" rx="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                </button>
            </div>
            <p class="token-info">This token expires in 1 hour. Store it securely.</p>
            <button type="button" class="btn-logout" id="logoutBtn" onclick="handleLogout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Logout
            </button>
        </div>

        <!-- Footer -->
        <p class="auth-footer">
            Built with <span class="heart">♥</span> for learning &middot; JWT Authentication Demo
        </p>
    </main>

    <!-- Link to our JavaScript -->
    <script src="app.js"></script>
</body>

</html>
